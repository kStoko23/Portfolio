<div
  class="fixed inset-0 bg-black/70 backdrop-blur-lg z-40 transition duration-850"
  [class]="isOpen() ? 'translate-x-0' : 'translate-x-full'"
>
  <nav class="flex justify-center items-center h-full text-7xl font-mono">
    <ul class="w-full">

      <li
        class="text-center py-6 border-y border-white/10 hover:bg-white/5 transition-colors duration-300"
      >
        <a
          class="inline-block w-full hover:text-accent transition-colors duration-300"
          href="#projects"
          (click)="linkClick.emit()"
          >{{ i18n.t().nav.work }}</a
        >
      </li>
      <li
        class="text-center py-6 border-y border-white/10 hover:bg-white/5 transition-colors duration-300"
      >
        <a
          class="inline-block w-full hover:text-accent transition-colors duration-300"
          href="#skills"
          (click)="linkClick.emit()"
          >{{ i18n.t().nav.skills }}</a
        >
      </li>
      <li
        class="text-center py-6 border-y border-white/10 hover:bg-white/5 transition-colors duration-300"
      >
        <a
          class="inline-block w-full hover:text-accent transition-colors duration-300"
          href="#about"
          (click)="linkClick.emit()"
          >{{ i18n.t().nav.about }}</a
        >
      </li>
      <li
        class="text-center py-6 border-y border-white/10 hover:bg-white/5 transition-colors duration-300"
      >
        <a
          class="inline-block w-full hover:text-accent transition-colors duration-300"
          href="#contact"
          (click)="linkClick.emit()"
          >{{ i18n.t().nav.contact }}</a
        >
      </li>
    </ul>
  </nav>
</div>
